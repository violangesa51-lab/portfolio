<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viola | Full-Stack Developer</title>
<style>
:root{color-scheme:dark;--bg:#120b1b;--panel:#190f24;--purple:#9953df;--border:#443055}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#f8f4fb;font-family:Georgia,'Times New Roman',serif}
header{background:var(--panel)}
.bar,main{max-width:1200px;margin:auto;padding-inline:28px}
.bar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-size:1.55rem;font-weight:bold}
nav,.actions{display:flex;flex-wrap:wrap;gap:24px}
a{color:inherit;text-decoration:none}
a:hover{color:#c38af8}
a:focus-visible,summary:focus-visible{outline:2px solid #c38af8;outline-offset:4px}
.hero{display:grid;grid-template-columns:1.65fr 1fr;gap:48px;align-items:center;min-height:490px;padding-block:40px}
h1{font-size:clamp(2.5rem,5vw,4.3rem);line-height:1.04;margin:0 0 28px}
h1 span{color:var(--purple)}
.hero p{max-width:430px;font-size:1.16rem;margin:0 0 48px}
.actions a,.social{border:1px solid #b8a9c4;border-radius:8px;padding:12px 18px}
.actions{gap:20px;font-family:Arial,sans-serif;font-size:.84rem}
.portrait{aspect-ratio:4/4.4;border:1px solid #a18dab;border-radius:36px;background:radial-gradient(ellipse at 55% 25%,#68434f,#302138 46%,#17111d 80%);display:grid;place-items:center;color:#e1cade;font-size:4.4rem}
section:not(.hero){padding-block:36px}
h2{text-align:center;margin:0 0 18px}
.bio{border:1px solid var(--border);border-radius:24px;padding:30px;margin:0 auto;text-align:center;max-width:1020px;font-size:clamp(1.2rem,2.3vw,1.95rem);line-height:1.35}
.panels{display:grid;grid-template-columns:repeat(3,1fr);align-items:start;gap:14px}
details{border:1px solid var(--border);border-radius:8px;background:#29143f;box-shadow:0 2px 6px #8a3cc243}
summary{cursor:pointer;text-align:center;padding:20px;font-weight:bold}
.detail{padding:0 18px 20px}
.stack{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stack span{background:var(--bg);border-radius:5px;padding:16px 8px;text-align:center}
#contact p{text-align:center;margin:0 0 16px}
.socials{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.social{display:flex;gap:12px;align-items:center}
.social b{font-size:1.2rem}
.social small{display:block;margin-top:3px}
.icon{font:bold 1.25rem Arial,sans-serif;min-width:29px;text-align:center}
footer{text-align:center;padding:20px;color:#cab9d4;font-size:.85rem}
@media(max-width:680px){.bar{flex-wrap:wrap;padding-block:18px}nav{gap:14px}.hero{grid-template-columns:1fr;gap:28px}.portrait{max-width:300px;width:100%}.panels{grid-template-columns:1fr}.socials{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head><body><header><div class="bar"><a class="brand" href="index.html">Viola.dev</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="skills.html">Skills</a><a href="projects.html">Projects</a><a href="services.html">Services</a><a href="contact.html">Contact</a></nav></div></header><main><section class="hero" aria-labelledby="intro">
<div><h1 id="intro">Hi, <span>I'm Viola.</span><br>I build things for the Web</h1><p>I'm a computer science student and a full-stack developer. I build functional, visually appealing websites.</p>
<div class="actions"><a href="projects.html" target="_blank" rel="noopener">View My Work</a><a href="contact.html" target="_blank" rel="noopener">Connect with me</a></div></div>
<img class="portrait" src="viola-portrait.png" alt="Viola, full-stack developer" style="display:block;width:100%;height:auto;object-fit:cover">
</section></main></body></html>
