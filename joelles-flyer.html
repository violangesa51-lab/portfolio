<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Joelles Catering flyer concept project by Viola Ngesa.">
  <title>Joelles Catering Flyer | Viola Ngesa</title>
  <style>
    :root { color-scheme: dark; --bg: #120a1c; --panel: #1b1026; --accent: #a64de0; --text: #f7f2fb; --muted: #d5c8df; --line: #69417b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(ellipse at 50% 0%, #30163e 0, var(--bg) 55%); color: var(--text); font: 17px/1.65 system-ui, sans-serif; }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 64px; }
    nav { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 48px; }
    a { color: inherit; }
    nav a, .back { color: #e4c2fa; text-decoration: none; }
    nav a:hover, .back:hover { text-decoration: underline; }
    .label { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; color: #e5cafa; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 16px 0 8px; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.12; }
    .intro { max-width: 700px; color: var(--muted); font-size: clamp(1.05rem, 2.5vw, 1.25rem); }
    .flyer { margin: 32px 0; padding: 12px; overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: var(--panel); }
    .flyer img { display: block; width: 100%; height: auto; border-radius: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 40px; }
    .button { display: inline-block; padding: 12px 20px; border: 1px solid #b97be0; border-radius: 12px; background: var(--accent); color: white; font-weight: 700; text-decoration: none; }
    .button:hover { background: #8d39c5; }
    section { padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: #1a1023; }
    h2 { margin: 0 0 8px; font-size: 1.35rem; }
    section p { margin: 0; color: var(--muted); }
    .back { display: inline-block; margin-top: 28px; }
    @media (max-width: 520px) { main { padding-top: 20px; } nav { margin-bottom: 34px; } .flyer { padding: 7px; border-radius: 16px; } section { padding: 19px; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Main navigation"><a href="index.html">Viola Ngesa</a><a href="projects.html">Projects</a></nav>
    <span class="label">Concept Design</span>
    <h1>Joelles Catering Flyer</h1>
    <p class="intro">A promotional flyer designed to showcase Joelles Catering and encourage event bookings.</p>
    <figure class="flyer"><img src="joelles-concept-flyer.png" alt="Promotional flyer concept for Joelles Catering"></figure>
    <div class="actions"><a class="button" href="joelles-concept-flyer.png" target="_blank" rel="noopener">View full-size flyer</a></div>
    <section><h2>Purpose</h2><p>To introduce Joelles Catering’s event services and encourage customers to enquire about bookings.</p></section>
    <a class="back" href="projects.html">← Back to Projects</a>
  </main>
</body>
</html>
